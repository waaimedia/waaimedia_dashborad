<main class="login-page" dir="ltr">
  <section class="login-visual" aria-hidden="true">
    <div class="visual-orb visual-orb--one"></div>
    <div class="visual-orb visual-orb--two"></div>
    <img src="assets/illustrations/login-hero.png" alt="login-hero" />
  </section>

  <section class="login-panel">
    <div class="login-card">
      <a class="brand" routerLink="/auth/login" aria-label="WAAI Media home">
        <span>WAAI</span>
        <span>MEDIA</span>
      </a>

      <header class="login-heading">
        <h1>Log in to your account</h1>
        <p>Welcome back! Enter your details to continue.</p>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="Enter your email"
          [attr.aria-invalid]="loginForm.controls.email.invalid && loginForm.controls.email.touched"
        />

        <label for="password">Password</label>
        <div class="password-field">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            [attr.aria-invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched"
          />
          <button
            class="password-toggle"
            type="button"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            (click)="showPassword.set(!showPassword())"
          >
            <i class="bi" [class.bi-eye]="!showPassword()" [class.bi-eye-slash]="showPassword()"></i>
          </button>
        </div>

        <div class="login-options">
         
          <a routerLink="/auth/forgot-password">Forgot password?</a>
        </div>

        <button class="login-button" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Logging in…' : 'Login' }}
        </button>
      </form>
    </div>
  </section>
</main>
