<section class="news-form-page">
  <div class="mobile-form-heading"><h2>{{ isEditMode() ? 'Update News' : 'Add News' }}</h2><p>Create bilingual news articles for the website.</p></div>
  <form class="news-form" [formGroup]="form" (ngSubmit)="save('published')" novalidate>
    <div class="form-grid mb-3">
      <div class="field"><label for="category">News Category</label><p-select inputId="category" [options]="categoryOptions()" optionLabel="label" optionValue="value" formControlName="categoryId" placeholder="Select a leaf category..." styleClass="category-select" /></div>
    </div>

    <div class="form-grid bilingual-grid">
      <div class="field"><label for="title-en">English Title</label><input id="title-en" type="text" formControlName="titleEn" placeholder="Enter the English title..." /></div>
      <div class="field" dir="rtl"><label for="title-ar">عنوان الخبر</label><input id="title-ar" type="text" formControlName="titleAr" placeholder="أدخل عنوان الخبر..." /></div>
      <div class="field"><label for="author-en">English Author Name</label><input id="author-en" type="text" formControlName="authorNameEn" placeholder="Enter author name..." /></div>
      <div class="field" dir="rtl"><label for="author-ar">اسم الكاتب</label><input id="author-ar" type="text" formControlName="authorNameAr" placeholder="أدخل اسم الكاتب..." /></div>
      <div class="field"><label for="description-en">English Short Description</label><textarea id="description-en" formControlName="shortDescriptionEn" rows="4" placeholder="A brief English summary..."></textarea></div>
      <div class="field" dir="rtl"><label for="description-ar">الوصف المختصر</label><textarea id="description-ar" formControlName="shortDescriptionAr" rows="4" placeholder="وصف مختصر للخبر..."></textarea></div>
    </div>

    <div class="field featured-image"><label for="featured-image">Featured Image</label><label class="upload-area" for="featured-image"><input id="featured-image" type="file" accept="image/png,image/jpeg,image/webp" (change)="selectFeaturedImage($event)" />@if (featuredImagePreview()) { <img class="featured-image-preview" [src]="featuredImagePreview()" [alt]="'Preview of ' + imageName()" /><strong>{{ imageName() }}</strong><span>Click to replace image</span> } @else { <i class="bi bi-cloud-arrow-up-fill"></i><strong>Click to upload a featured image</strong><span>PNG, JPG, WEBP up to 10MB</span> }</label></div>

    <div class="form-grid bilingual-grid editors-grid">
      <div class="field"><label for="content-en">English Article Content</label><input #englishImageInput class="editor-image-input" type="file" accept="image/png,image/jpeg,image/webp" multiple (change)="selectEditorImages('en', $event)" /><button class="editor-upload" type="button" (click)="chooseEditorImage('en')" [disabled]="uploadingEditorImage()"><i class="bi bi-image"></i> Add image to English content</button><p-editor inputId="content-en" formControlName="contentEn" placeholder="Write the English article content..." styleClass="article-editor" (onInit)="onEditorInit('en', $event)" /></div>
      <div class="field" dir="rtl"><label for="content-ar">محتوى الخبر</label><input #arabicImageInput class="editor-image-input" type="file" accept="image/png,image/jpeg,image/webp" multiple (change)="selectEditorImages('ar', $event)" /><button class="editor-upload" type="button" (click)="chooseEditorImage('ar')" [disabled]="uploadingEditorImage()"><i class="bi bi-image"></i> إضافة صورة للمحتوى العربي</button><p-editor inputId="content-ar" formControlName="contentAr" placeholder="اكتب محتوى الخبر هنا..." styleClass="article-editor article-editor--rtl" (onInit)="onEditorInit('ar', $event)" /></div>
    </div>
    <p class="editor-help">Editor images are uploaded to the media service and inserted with their verified image ID.</p>
    <div class="form-actions"><button type="button" class="cancel" (click)="cancel()">Cancel</button><button type="button" class="draft" (click)="save('draft')">Save as a Draft</button><button type="submit" class="publish"><i class="bi bi-send-fill"></i> Publish News</button></div>
  </form>
</section>
