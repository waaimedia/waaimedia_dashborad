<section class="news-page">
  <div class="news-heading"><h2>Blogs Management</h2><button class="add-news" type="button" (click)="addBlog()"><i class="bi bi-plus-lg"></i> Add Blog</button></div>
  <article class="articles-panel">
    <div class="panel-toolbar"><h3>Recent Blog Posts</h3><div class="filters"><label class="search-field"><i class="bi bi-search"></i><input type="search" placeholder="Search blog posts..." [value]="query()" (input)="setQuery($any($event.target).value)" aria-label="Search blog posts" /></label><p-select [options]="statusOptions" optionLabel="label" optionValue="value" [ngModel]="status()" (ngModelChange)="setStatus($event)" ariaLabel="Filter by status" styleClass="status-select" /></div></div>
    <div class="articles-table"><div class="table-head"><span>Title</span><span>Category</span><span>Status</span><span>Actions</span></div>
      @for (post of paginatedPosts(); track post.id) { <article class="article-row"><div class="article-title"><span class="article-icon"><i class="bi bi-layout-text-window-reverse"></i></span><div><strong>{{ post.title }}</strong><span>{{ post.excerpt }}</span></div></div><span class="article-category">{{ post.category }}</span><span class="status" [class.status--draft]="post.status === 'Draft'">{{ post.status }}</span><div class="actions"><a [routerLink]="['/dashboard/blogs', post.id, 'edit']" [attr.aria-label]="'Edit ' + post.title"><i class="bi bi-pencil-square"></i></a>@if (canDelete()) { <button type="button" class="delete" [attr.aria-label]="'Delete ' + post.title" (click)="deletePost(post)"><i class="bi bi-trash3-fill"></i></button> }</div></article> } @empty { <p class="empty-state">No blog posts match your filters.</p> }
    </div>
    <app-pagination [page]="page()" [pageSize]="pageSize" [totalRecords]="filteredPosts().length" (pageChange)="changePage($event)" />
  </article>
</section>
