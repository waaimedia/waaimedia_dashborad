<section class="news-page">
  <div class="news-heading"><h2>Blogs Management</h2><button class="add-news" type="button" (click)="addBlog()"><i class="bi bi-plus-lg"></i> Add Blog</button></div>
  <article class="articles-panel">
    <div class="panel-toolbar"><h3>Recent Blog Posts</h3><div class="filters flex-wrap"><label class="search-field"><i class="bi bi-search"></i><input type="search" placeholder="Search blog posts..." [value]="query()" (input)="setQuery($any($event.target).value)" aria-label="Search blog posts" /></label><p-select [options]="categoryOptions()" optionLabel="label" optionValue="value" [ngModel]="categoryId()" (ngModelChange)="setCategory($event)" ariaLabel="Filter by category" styleClass="category-filter-select" /><p-select [options]="statusOptions" optionLabel="label" optionValue="value" [ngModel]="status()" (ngModelChange)="setStatus($event)" ariaLabel="Filter by status" styleClass="status-select" /></div></div>
    <div class="articles-table"><div class="table-head"><span>Title</span><span>Category</span><span>Status</span><span>Actions</span></div>
      @for (post of posts(); track post.id) { <article class="article-row"><div class="article-title"><span class="article-icon"><i class="bi bi-layout-text-window-reverse"></i></span><div><strong>{{ title(post) }}</strong><span>{{ summary(post) }}</span></div></div><span class="article-category">{{ categoryName(post) }}</span><span class="status" [class.status--draft]="post.status === 'draft'">{{ post.status }}</span><div class="actions"><a [routerLink]="['/dashboard/blogs', post.id, 'edit']" [attr.aria-label]="'Edit ' + title(post)"><i class="bi bi-pencil-square"></i></a>@if (canDelete()) { <button type="button" class="delete" (click)="deletePost(post)" [attr.aria-label]="'Delete ' + title(post)"><i class="bi bi-trash3-fill"></i></button> }</div></article> } @empty { <p class="empty-state">No blog posts match your filters.</p> }
    </div>
    <app-pagination [page]="page()" [pageSize]="pageSize" [totalRecords]="totalRecords()" (pageChange)="changePage($event)" />
  </article>
</section>
