@if (totalRecords() > 0) {
  <nav class="pagination" aria-label="Pagination">
    <span>Showing {{ firstRecord() }} to {{ lastRecord() }} of {{ totalRecords() }} results</span>
    <div class="pagination__controls">
      <button type="button" [disabled]="page() === 1" (click)="goTo(page() - 1)">Previous</button>
      @for (pageNumber of pages(); track pageNumber) {
        <button
          type="button"
          [class.is-current]="pageNumber === page()"
          [attr.aria-current]="pageNumber === page() ? 'page' : null"
          (click)="goTo(pageNumber)"
        >
          {{ pageNumber }}
        </button>
      }
      <button type="button" [disabled]="page() === totalPages()" (click)="goTo(page() + 1)">Next</button>
    </div>
  </nav>
}
